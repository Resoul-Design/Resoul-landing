<script>
/* 分享／複製連結及分享圖片：支援 Web Share 的手機直接開分享選單，否則複製連結 */
(function () {
  var msg = document.getElementById("plMsg");
  var copied = "已複製連結：", failed = "未能分享，請長按圖片儲存，或按「複製連結」。";
  var files = {};
  function say(text) { msg.textContent = text; msg.hidden = false; clearTimeout(say.t); say.t = setTimeout(function () { msg.hidden = true; }, 4000); }
  function pageUrl() { return location.origin + location.pathname; }
  function copy(url) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(url).then(function () { say(copied + url); }, function () { window.prompt("", url); });
    }
    window.prompt("", url);
  }
  function shareLink() {
    var url = pageUrl();
    if (!navigator.share) return copy(url);
    navigator.share({ title: document.title, url: url }).catch(function (e) { if (e && e.name !== "AbortError") copy(url); });
  }
  document.querySelectorAll("[data-share-link]").forEach(function (b) { b.addEventListener("click", shareLink); });
  document.querySelectorAll("[data-copy-link]").forEach(function (b) { b.addEventListener("click", function () { copy(pageUrl()); }); });
  // 預先準備圖片檔，令按下「分享圖片」時可即時開啟分享選單
  document.querySelectorAll("[data-share-img]").forEach(function (b) {
    var src = b.getAttribute("data-share-img"), name = b.getAttribute("data-name");
    if (window.File && navigator.canShare) {
      fetch(src).then(function (r) { return r.blob(); }).then(function (blob) { files[src] = new File([blob], name, { type: "image/jpeg" }); }).catch(function () {});
    }
    b.addEventListener("click", function () {
      var f = files[src];
      if (f && navigator.canShare && navigator.canShare({ files: [f] })) {
        navigator.share({ files: [f], title: document.title }).catch(function (e) { if (e && e.name !== "AbortError") say(failed); });
      } else {
        shareLink();
      }
    });
  });
})();
</script>
